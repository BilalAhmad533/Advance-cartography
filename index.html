<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Geographic Distribution of Labour's share of GDP 2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root{
      --bg:#f6f8fc;
      --panel: rgba(255,255,255,0.84);
      --panel2: rgba(255,255,255,0.70);
      --text:#0f172a;
      --muted:#64748b;
      --border: rgba(15,23,42,0.12);
      --shadow: 0 18px 45px rgba(15,23,42,0.14);
      --shadow2: 0 10px 26px rgba(15,23,42,0.12);

      --primary:#2563eb;
      --accent:#ff7a18;

      --header-h: 92px;
      --tile-filter: none;
    }
    [data-theme="dark"]{
      --bg:#070b15;
      --panel: rgba(17,24,39,0.78);
      --panel2: rgba(17,24,39,0.58);
      --text:#f8fafc;
      --muted:#b6c2d6;
      --border: rgba(255,255,255,0.14);
      --shadow: 0 22px 60px rgba(0,0,0,0.55);
      --shadow2: 0 12px 28px rgba(0,0,0,0.45);

      --primary:#60a5fa;
      --accent:#ff9b3d;

      --tile-filter: brightness(0.9) contrast(1.05) saturate(0.9);
    }

    html, body{ height:100%; margin:0; background:var(--bg); color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, Helvetica, sans-serif;
      overflow:hidden;
    }

    /* Header */
    .topbar{
      position: fixed; top:0; left:0; right:0;
      z-index: 2000;
      background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.40));
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] .topbar{
      background: linear-gradient(180deg, rgba(17,24,39,0.70), rgba(17,24,39,0.45));
    }
    .top-accent{ height:4px; background: linear-gradient(90deg, var(--primary), var(--accent), #22c55e); }
    .top-inner{
      height: calc(var(--header-h) - 4px);
      display:flex; align-items:center; justify-content:space-between;
      padding: 12px 14px; box-sizing:border-box; gap: 12px;
    }
    .brand{ display:flex; align-items:center; gap: 12px; min-width:0; }
    .logo{
      width: 68px; height: 68px;
      border-radius: 16px;
      padding: 8px;
      background: rgba(255,255,255,0.75);
      border: 1px solid var(--border);
      box-shadow: var(--shadow2);
      object-fit: contain;
      box-sizing: border-box;
    }
    [data-theme="dark"] .logo{ background: rgba(0,0,0,0.20); }

    .title-wrap{ display:flex; flex-direction:column; gap: 6px; min-width:0; }
    .title{
      font-size: 18px; font-weight: 900; letter-spacing: 0.2px;
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
      line-height: 1.05;
    }
    .subtitle{
      display:flex; align-items:center; gap: 10px;
      color: var(--muted); font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
    }
    .chip{
      display:inline-flex; align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel2);
      box-shadow: 0 8px 18px rgba(15,23,42,0.06);
      font-size: 12px;
      color: var(--muted);
    }
    .chip b{ color: var(--text); }

    .actions{ display:flex; align-items:center; gap: 8px; }
    .hbtn{
      appearance:none;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(15,23,42,0.08);
      transition: transform .06s ease, background .18s ease, border-color .18s ease;
    }
    .hbtn:hover{ background: rgba(37,99,235,0.10); border-color: rgba(37,99,235,0.25); }
    .hbtn.danger:hover{ background: rgba(255,122,24,0.12); border-color: rgba(255,122,24,0.28); }
    .hbtn:active{ transform: translateY(1px); }

    /* Map */
    #map{
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      width: 100vw;
      height: calc(100vh - var(--header-h));
      background: var(--bg);
    }
    .leaflet-tile{ filter: var(--tile-filter); }

    /* Left Panel */
    .panel{
      width: 380px;
      max-width: min(92vw, 430px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      margin-top: 68px;
    }
    .panel-head{
      padding: 12px 14px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .panel-head .left{ display:flex; flex-direction:column; gap: 3px; min-width:0; }
    .panel-head .left strong{ font-size: 14px; font-weight: 950; }
    .panel-head .left span{ font-size: 12px; color: var(--muted); font-weight: 750; }
    .iconbtn{
      width: 38px; height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel2);
      cursor:pointer;
      font-weight: 950;
      color: var(--text);
      box-shadow: 0 8px 18px rgba(15,23,42,0.06);
    }
    .iconbtn:hover{ background: rgba(37,99,235,0.10); }

    .panel-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 12px;
    }
    .card{
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.45);
    }
    [data-theme="dark"] .card{ background: rgba(17,24,39,0.34); }

    .lbl{
      display:flex; justify-content:space-between; align-items:center; gap: 8px;
      font-size: 12px; font-weight: 950; color: var(--muted);
      margin-bottom: 6px;
    }
    .lbl small{ font-weight: 900; color: var(--muted); }

    input[type="text"], select{
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline:none;
      background: rgba(255,255,255,0.72);
      color: var(--text);
      font-weight: 850;
      box-sizing:border-box;
    }
    [data-theme="dark"] input[type="text"], [data-theme="dark"] select{ background: rgba(0,0,0,0.22); }

    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    .btn{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.75);
      color: var(--text);
      padding: 11px 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 950;
      cursor:pointer;
      box-shadow: 0 8px 16px rgba(15,23,42,0.08);
      transition: transform .06s ease, background .18s ease, border-color .18s ease;
    }
    [data-theme="dark"] .btn{ background: rgba(0,0,0,0.22); box-shadow: 0 10px 18px rgba(0,0,0,0.35); }
    .btn:hover{ background: rgba(37,99,235,0.10); border-color: rgba(37,99,235,0.25); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ background: rgba(37,99,235,0.14); border-color: rgba(37,99,235,0.30); }
    .btn.warn{ background: rgba(255,122,24,0.12); border-color: rgba(255,122,24,0.28); }

    .range{ width:100%; margin-top: 8px; }

    .row{ display:flex; align-items:center; justify-content:space-between; gap: 10px; }
    .switch{
      width: 46px; height: 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15,23,42,0.15);
      position: relative;
      cursor: pointer;
      flex: 0 0 auto;
    }
    [data-theme="dark"] .switch{ background: rgba(255,255,255,0.12); }
    .switch::after{
      content:"";
      width: 22px; height: 22px;
      border-radius: 999px;
      background: var(--bg);
      position:absolute;
      top: 2px; left: 2px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
      transition: left .18s ease;
    }
    .switch.on{ background: rgba(37,99,235,0.30); border-color: rgba(37,99,235,0.30); }
    .switch.on::after{ left: 22px; }

    .hint{
      font-size: 12px;
      font-weight: 850;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Info box */
    .info{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(14px);
      padding: 12px 14px;
      max-width: min(460px, 72vw);
      line-height: 1.35;
    }
    .info h4{ margin: 0 0 6px; font-size: 13px; font-weight: 950; }
    .info .muted{ color: var(--muted); font-size: 12px; font-weight: 850; }
    .info .big{ font-weight: 1000; font-size: 14px; margin-top: 2px; }

    .barwrap{
      margin-top: 10px;
      background: rgba(15,23,42,0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
    }
    [data-theme="dark"] .barwrap{ background: rgba(255,255,255,0.10); }
    .bar{
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width .35s ease;
    }
    .barscale{
      display:flex;
      justify-content:space-between;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
    }

    .country-label{
      font-weight: 1000;
      font-size: 12px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      box-shadow: var(--shadow2);
      white-space: nowrap;
      pointer-events: none;
    }

    .credit{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 850;
      margin-right: 12px;
      margin-bottom: 28px;
    }

    .map-legend{
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(0,0,0,0.20);
      border-radius: 6px;
      box-shadow: 0 10px 26px rgba(15,23,42,0.14);
      padding: 10px 12px;
      line-height: 1.2;
      min-width: 190px;
      margin-right: 12px;
      margin-bottom: 78px;
    }
    [data-theme="dark"] .map-legend{
      background: rgba(17,24,39,0.86);
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }
    .map-legend .ttl{ font-weight: 950; font-size: 13px; margin-bottom: 8px; color: var(--text); }
    .map-legend .lrow{
      display:flex; align-items:center; gap: 10px;
      margin: 6px 0; font-size: 12px; font-weight: 850;
      white-space: nowrap;
    }
    .map-legend .sw{
      width: 18px; height: 14px;
      border: 1px solid rgba(0,0,0,0.25);
      border-radius: 2px;
      flex: 0 0 auto;
    }
    [data-theme="dark"] .map-legend .sw{ border-color: rgba(255,255,255,0.20); }
    .map-legend .note{ margin-top: 8px; font-size: 11px; font-weight: 850; color: var(--muted); }

    @media (max-width: 760px){
      :root{ --header-h: 108px; }
      .actions{ display:none; }
      .logo{ width: 58px; height: 58px; }
      .title{ font-size: 16px; }
      .subtitle{ font-size: 12px; }
      .map-legend{ margin-bottom: 92px; }
    }
  </style>
</head>

<body data-theme="light">
  <header class="topbar">
    <div class="top-accent"></div>
    <div class="top-inner">
      <div class="brand">
        <img class="logo" src="images/logo.png" alt="Logo"/>
        <div class="title-wrap">
          <!-- ✅ Title injected by JS -->
          <div class="title" id="appTitle"></div>
          <!-- <div class="subtitle">
            <span>Hover • Click to select • ESC clears</span>
            <span class="chip" id="topChip"><b>Ready</b></span>
          </div> -->
        </div>
      </div>

      <div class="actions">
        <button id="btnHeaderReset" class="hbtn" type="button">Reset view</button>
        <button id="btnHeaderClear" class="hbtn danger" type="button">Clear selection</button>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ✅ Change ONLY here (one source of truth)
    const APP_TITLE = "Geographic Distribution of Labour's share of GDP 2024";

    // ===== SETTINGS =====
    const GEOJSON_FILE = "./clipqgis_wgs84.geojson";
    const CLASS_FIELD  = "SL_EMP_G20";
    const NAME_FIELD   = "COUNTRY";
    const LEGEND_TITLE = "Labour's Share of GDP (%)";

    const CLASSES = [
      { label:"30% - 40%", color:"#cfeccf" },
      { label:"40% - 50%", color:"#8fd18f" },
      { label:"50% - 60%", color:"#2f8f4f" },
      { label:"60% - 70%", color:"#0b4a2b" },
      { label:"Unreported Data", color:"#9a9a9a", na:true }
    ];

    const VALUE_MIN = 0;
    const VALUE_MAX = 70;

    // ✅ Apply title everywhere
    document.title = APP_TITLE; // browser tab
    const titleEl = document.getElementById("appTitle");
    if (titleEl) titleEl.textContent = APP_TITLE;

    // ===== Helpers =====
    const topChip = document.getElementById("topChip");
    const setChip = (t) => topChip && (topChip.innerHTML = `<b>${t}</b>`);
    const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

    // ✅ Treat 0 as unreported data
    function parseValue(raw){
      if (raw === null || raw === undefined) return NaN;
      const s = String(raw).trim();
      if (!s) return NaN;
      const bad = ["na","n/a","null","none","..","—","-"];
      if (bad.includes(s.toLowerCase())) return NaN;
      const v = Number(s);
      if (!Number.isFinite(v)) return NaN;
      if (v === 0) return NaN;
      return v;
    }

    function getColor(v){
      if (Number.isNaN(v)) return CLASSES[4].color;
      if (v < 40) return CLASSES[0].color;
      if (v < 50) return CLASSES[1].color;
      if (v < 60) return CLASSES[2].color;
      return CLASSES[3].color;
    }

    function stopMapEvents(el){
      L.DomEvent.disableClickPropagation(el);
      L.DomEvent.disableScrollPropagation(el);
    }

    // ===== Map + basemaps =====
    const map = L.map('map', { worldCopyJump:true, zoomControl:true }).setView([20,0],2);

    const baseMaps = {
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
      }),
      "Carto Light": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }),
      "Carto Dark": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }),
      "Esri World Imagery": L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
      ),
      "Esri Light Gray": L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 20, attribution: 'Tiles &copy; Esri' }
      )
    };
    baseMaps["OpenStreetMap"].addTo(map);
    L.control.layers(baseMaps, null, { position:'topright', collapsed:true }).addTo(map);

    // Credit (bottom-right)
    const credit = L.control({ position:'bottomright' });
    credit.onAdd = function(){
      const div = L.DomUtil.create('div','credit');
      div.innerHTML = 'Prepared by <b>Bilal Ahmad</b>';
      stopMapEvents(div);
      return div;
    };
    credit.addTo(map);

    // Legend (bottom-right)
    const mapLegend = L.control({ position:'bottomright' });
    mapLegend.onAdd = function(){
      const div = L.DomUtil.create('div','map-legend');
      div.innerHTML = `
        <div class="ttl">${LEGEND_TITLE}</div>
        <div class="lrow"><span class="sw" style="background:${CLASSES[0].color}"></span>${CLASSES[0].label}</div>
        <div class="lrow"><span class="sw" style="background:${CLASSES[1].color}"></span>${CLASSES[1].label}</div>
        <div class="lrow"><span class="sw" style="background:${CLASSES[2].color}"></span>${CLASSES[2].label}</div>
        <div class="lrow"><span class="sw" style="background:${CLASSES[3].color}"></span>${CLASSES[3].label}</div>
        <div class="lrow"><span class="sw" style="background:${CLASSES[4].color}"></span>${CLASSES[4].label}</div>
        <div class="note">Hover to preview • Click to select</div>
      `;
      stopMapEvents(div);
      return div;
    };
    mapLegend.addTo(map);

    // Info box (top-right)
    const info = L.control({ position:'topright' });
    info.onAdd = function(){
      this._div = L.DomUtil.create('div','info');
      stopMapEvents(this._div);
      this.update();
      return this._div;
    };
    info.update = function(props, selected=false){
      if (!props){
        this._div.innerHTML = `
          <h4>${APP_TITLE}</h4>
          <div class="muted">Hover over a country • Click to select</div>
          <div class="barwrap"><div class="bar" style="width:0%"></div></div>
          <div class="barscale"><span>${VALUE_MIN}</span><span>${VALUE_MAX}</span></div>
        `;
        return;
      }
      const v = parseValue(props[CLASS_FIELD]);
      const pct = Number.isNaN(v) ? 0 : (clamp(v, VALUE_MIN, VALUE_MAX)-VALUE_MIN)/(VALUE_MAX-VALUE_MIN)*100;

      this._div.innerHTML = `
        <h4>${APP_TITLE}</h4>
        <div class="big">${props[NAME_FIELD] ?? "Unknown"}${selected ? ` <span style="color:var(--accent); font-weight:1000;">• selected</span>` : ""}</div>
        <div class="muted">Value: <b style="color:var(--text);">${Number.isNaN(v) ? "Unreported Data" : v.toFixed(2)}</b></div>
        <div class="barwrap"><div class="bar" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="barscale"><span>${VALUE_MIN}</span><span>${VALUE_MAX}</span></div>
      `;
    };
    info.addTo(map);

    // Hover label
    const hoverLabel = L.tooltip({ permanent:false, direction:'top', sticky:true, opacity:1 }).setContent("");
    function showHoverLabel(e, name){
      hoverLabel.setContent(`<span class="country-label">${name}</span>`);
      hoverLabel.setLatLng(e.latlng);
      if (!map.hasLayer(hoverLabel)) hoverLabel.addTo(map);
    }
    function hideHoverLabel(){
      if (map.hasLayer(hoverLabel)) map.removeLayer(hoverLabel);
    }

    // Styles
    let fillOpacity = 0.78;
    function baseStyle(feature){
      const v = parseValue(feature?.properties?.[CLASS_FIELD]);
      return { fillColor:getColor(v), weight:1, color:'rgba(255,255,255,0.92)', fillOpacity };
    }
    function hoverStyle(){ return { weight:3, color:'#0b0f1a', fillOpacity: Math.min(0.95, fillOpacity+0.12) }; }
    function selectedStyle(){ return { weight:4, color:'#ff7a18', fillOpacity: Math.min(0.98, fillOpacity+0.16) }; }

    let geoLayer, selectedLayer=null, lastBounds=null;

    function clearSelection(){
      if (selectedLayer){
        geoLayer.resetStyle(selectedLayer);
        selectedLayer = null;
        info.update();
        setChip("Selection cleared");
      }
    }
    function setSelected(layer){
      clearSelection();
      selectedLayer = layer;
      layer.setStyle(selectedStyle());
      layer.bringToFront();
      info.update(layer.feature.properties, true);

      const v = parseValue(layer.feature.properties[CLASS_FIELD]);
      setChip(`${layer.feature.properties[NAME_FIELD] ?? "Unknown"} • ${Number.isNaN(v) ? "Unreported" : v.toFixed(2)}`);
    }
    function resetHighlight(e){
      const layer = e.target;
      if (selectedLayer && layer === selectedLayer) return;
      geoLayer.resetStyle(layer);
      if (!selectedLayer) info.update();
      hideHoverLabel();
      setChip("Hover a country");
    }
    function highlightFeature(e){
      const layer = e.target;
      if (selectedLayer && layer === selectedLayer) return;

      layer.setStyle(hoverStyle());
      layer.bringToFront();
      info.update(layer.feature.properties, false);

      const name = (layer.feature?.properties?.[NAME_FIELD] ?? "Unknown").toString();
      showHoverLabel(e, name);

      const v = parseValue(layer.feature?.properties?.[CLASS_FIELD]);
      setChip(`${name} • ${Number.isNaN(v) ? "Unreported" : v.toFixed(2)}`);
    }
    function zoomToFeature(layer){ map.fitBounds(layer.getBounds(), { padding:[14,14] }); }

    function onEachFeature(feature, layer){
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        mousemove: (e) => showHoverLabel(e, (feature.properties?.[NAME_FIELD] ?? "Unknown").toString()),
        click: () => { setSelected(layer); zoomToFeature(layer); layer.openPopup(); }
      });

      const v = parseValue(feature.properties[CLASS_FIELD]);
      layer.bindPopup(
        `<b>${feature.properties[NAME_FIELD] ?? "Unknown"}</b><br>` +
        `${LEGEND_TITLE}: ${Number.isNaN(v) ? "Unreported Data" : v.toFixed(2)}`
      );
    }

    // Left panel control
    const panel = L.control({ position:'topleft' });
    panel.onAdd = function(){
      const div = L.DomUtil.create('div','panel');
      div.innerHTML = `
        <div class="panel-head">
          <div class="left">
            <strong>Interactive Controls</strong>
            <span>Search • Basemap • Style</span>
          </div>
          <button class="iconbtn" id="btnCollapse" title="Collapse panel">▾</button>
        </div>

        <div class="panel-body" id="panelBody">
          <div class="card">
            <div class="lbl">Basemap <small>background</small></div>
            <select id="basemapSelect">
              <option value="OpenStreetMap">OpenStreetMap</option>
              <option value="Carto Light">Carto Light</option>
              <option value="Carto Dark">Carto Dark</option>
              <option value="Esri World Imagery">Esri World Imagery</option>
              <option value="Esri Light Gray">Esri Light Gray</option>
            </select>
          </div>

          <div class="card">
            <div class="lbl">Search Country <small>exact/contains</small></div>
            <input id="countrySearch" type="text" placeholder="Type a country name…" list="countryList"/>
            <datalist id="countryList"></datalist>

            <div class="grid2">
              <button class="btn primary" id="btnFind">Find</button>
              <button class="btn" id="btnClearSearch">Clear</button>
            </div>

            <div class="grid2">
              <button class="btn warn" id="btnClearSel">Clear selection</button>
              <button class="btn" id="btnResetView">Reset view</button>
            </div>
          </div>

          <div class="card">
            <div class="lbl">Fill opacity <small id="opacityVal">78%</small></div>
            <input class="range" id="opacityRange" type="range" min="40" max="95" value="78"/>

            <div style="height:10px"></div>
            <div class="row">
              <div>
                <div style="font-weight:1000;">Dark mode</div>
                <div class="hint">Switch UI theme</div>
              </div>
              <div class="switch" id="darkSwitch" role="switch" aria-checked="false" tabindex="0"></div>
            </div>

            <div style="margin-top:10px" class="hint">
              Hover to preview • Click to select • ESC clears selection
            </div>
            <div class="hint" id="panelMsg" style="min-height:16px;margin-top:8px;"></div>
          </div>
        </div>
      `;
      stopMapEvents(div);
      return div;
    };
    panel.addTo(map);

    function norm(s){ return (s ?? "").toString().trim().toLowerCase(); }
    function findLayerByName(query){
      if (!geoLayer) return null;
      const q = norm(query);
      if (!q) return null;

      let exact = null;
      geoLayer.eachLayer(l => {
        const n = norm(l.feature?.properties?.[NAME_FIELD]);
        if (n === q) exact = l;
      });
      if (exact) return exact;

      let contains = null;
      geoLayer.eachLayer(l => {
        const n = norm(l.feature?.properties?.[NAME_FIELD]);
        if (!contains && n.includes(q)) contains = l;
      });
      return contains;
    }

    function wirePanel(){
      const panelMsg = document.getElementById("panelMsg");
      const setMsg = (t)=> panelMsg && (panelMsg.textContent = t || "");

      const basemapSelect = document.getElementById("basemapSelect");
      basemapSelect.addEventListener("change", () => {
        const name = basemapSelect.value;
        Object.keys(baseMaps).forEach(k => map.hasLayer(baseMaps[k]) && map.removeLayer(baseMaps[k]));
        baseMaps[name].addTo(map);
        setMsg(`Basemap changed: ${name}`);
      });

      const input = document.getElementById("countrySearch");
      const btnFind = document.getElementById("btnFind");
      const btnClearSearch = document.getElementById("btnClearSearch");
      const btnClearSel = document.getElementById("btnClearSel");
      const btnResetView = document.getElementById("btnResetView");

      function doFind(){
        setMsg("");
        const layer = findLayerByName(input.value);
        if (!layer){ setMsg("Not found. Ensure the name matches your COUNTRY field."); return; }
        setSelected(layer);
        zoomToFeature(layer);
        layer.openPopup();
        setMsg("Found!");
      }

      btnFind.addEventListener("click", doFind);
      input.addEventListener("keydown", (e)=>{ if (e.key === "Enter") doFind(); });

      btnClearSearch.addEventListener("click", ()=>{ input.value=""; setMsg(""); });
      btnClearSel.addEventListener("click", ()=>{ clearSelection(); setMsg("Selection cleared."); });

      btnResetView.addEventListener("click", ()=> {
        if (lastBounds) map.fitBounds(lastBounds, { padding:[14,14] });
        setMsg("View reset.");
        setChip("View reset");
      });

      const opacityRange = document.getElementById("opacityRange");
      const opacityVal = document.getElementById("opacityVal");
      opacityRange.addEventListener("input", () => {
        fillOpacity = clamp(Number(opacityRange.value)/100, 0.4, 0.95);
        opacityVal.textContent = `${Math.round(fillOpacity*100)}%`;
        if (geoLayer) geoLayer.setStyle(baseStyle);
        if (selectedLayer) selectedLayer.setStyle(selectedStyle());
      });

      const darkSwitch = document.getElementById("darkSwitch");
      function setTheme(theme){
        document.body.setAttribute("data-theme", theme);
        const isDark = theme === "dark";
        darkSwitch.classList.toggle("on", isDark);
        darkSwitch.setAttribute("aria-checked", String(isDark));
        localStorage.setItem("sdg_theme", theme);
      }
      function toggleTheme(){
        const cur = document.body.getAttribute("data-theme") || "light";
        setTheme(cur === "light" ? "dark" : "light");
      }
      darkSwitch.addEventListener("click", toggleTheme);
      darkSwitch.addEventListener("keydown", (e)=>{ if (e.key==="Enter" || e.key===" ") toggleTheme(); });

      const saved = localStorage.getItem("sdg_theme");
      if (saved === "dark" || saved === "light") setTheme(saved);

      // collapse panel
      const btnCollapse = document.getElementById("btnCollapse");
      const panelBody = document.getElementById("panelBody");
      let collapsed = false;
      btnCollapse.addEventListener("click", () => {
        collapsed = !collapsed;
        panelBody.style.display = collapsed ? "none" : "grid";
        btnCollapse.textContent = collapsed ? "▸" : "▾";
      });

      window.__setCountryList = (names) => {
        const dl = document.getElementById("countryList");
        dl.innerHTML = "";
        names.filter(Boolean).sort((a,b)=>a.localeCompare(b)).forEach(n=>{
          const opt = document.createElement("option");
          opt.value = n;
          dl.appendChild(opt);
        });
      };
    }

    async function load(){
      try{
        setChip("Loading…");
        const res = await fetch(GEOJSON_FILE);
        if (!res.ok) throw new Error("GeoJSON not found. Status: " + res.status);
        const data = await res.json();

        geoLayer = L.geoJSON(data, { style: baseStyle, onEachFeature }).addTo(map);
        lastBounds = geoLayer.getBounds();
        map.fitBounds(lastBounds, { padding:[14,14] });

        const names = [];
        geoLayer.eachLayer(l => {
          const n = l.feature?.properties?.[NAME_FIELD];
          if (n) names.push(String(n));
        });
        window.__setCountryList && window.__setCountryList(names);

        setChip("Ready");
      }catch(err){
        console.error(err);
        alert(err.message);
        setChip("Error");
      }
    }

    // Header buttons
    document.getElementById("btnHeaderReset")?.addEventListener("click", () => {
      if (lastBounds) map.fitBounds(lastBounds, { padding:[14,14] });
      setChip("View reset");
    });
    document.getElementById("btnHeaderClear")?.addEventListener("click", () => clearSelection());

    // ESC clears selection
    document.addEventListener("keydown", (e)=>{ if (e.key === "Escape") clearSelection(); });

    // init
    wirePanel();
    load();
  </script>
</body>
</html>
