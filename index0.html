<!DOCTYPE HTML>

<html>
	<head>
		<meta charset="utf-8">
		<title>Leaflet Example Interactivity</title>
		
		<!--link to stylesheet-->
		<link rel="stylesheet" href="css/style.css">
		<!-- link to leaflet stylesheet-->
		<link rel="stylesheet" href="css/leaflet.css">			
		<!-- link to leaflet javascript library-->
		<script src="js/leaflet-src.js"></script>
		<!--link to the file that contains geoJson data-->
		
		 
		<script src="data/mwalk.js" type="text/javascript"> </script> 
		<script src="data/nationalparks.js" type="text/javascript"> </script> 		
	</head>
	<body>
		<!--the sequence of elements called matters!-->
		<!-- title of your map-->
		<h1> Leaflet Example Interactivity </h1>
		
		<!-- division div for the map -->
		<div id="map"></div>
		

		<!-- in index.html, before app.js -->
		<script src="js/npark.js"></script>
		<script src="js/app.js"></script>
		 
		<!-- link to main javascript file -->
		<script src="js/main.js"></script>
		
	</body>

	<script>
  const map = L.map('map');

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  fetch('clipqgis_wgs84.geojson')
    .then(res => res.json())
    .then(data => {
      const layer = L.geoJSON(data, {
        style: {
          color: '#0066cc',
          weight: 2,
          fillOpacity: 0.3
        },
        onEachFeature: (feature, layer) => {
          let popup = '';
          for (let k in feature.properties) {
            popup += `<b>${k}</b>: ${feature.properties[k]}<br>`;
          }
          layer.bindPopup(popup);
        }
      }).addTo(map);

      map.fitBounds(layer.getBounds());
    });
</script>
