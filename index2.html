<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SDG 10.4 (2024) – Hover + Fixed Classes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 90vh; width: 100vw; }

    .legend, .info {
      line-height: 18px;
      color: #555;
      background: white;
      padding: 8px 10px;
      font: 14px Arial, Helvetica, sans-serif;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 6px;
    }
    .legend h4, .info h4 { margin: 0 0 6px; font-size: 14px; }

    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
    }

    .credit {
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 8px;
      font-size: 12px;
      color: #333;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ===== SETTINGS =====
  const GEOJSON_FILE = "./clipqgis_wgs84.geojson";
  const CLASS_FIELD = "SL_EMP_G20";   // 2024 (your column)
  const LEGEND_TITLE = "SDG 10.4 (2024): Labour Income Share (%)";
  // ====================

  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Credit control (Prepared by...)
  const credit = L.control({ position: 'bottomleft' });
  credit.onAdd = function () {
    const div = L.DomUtil.create('div', 'credit');
    div.innerHTML = 'Prepared by <b>Bilal Ahmad</b>';
    return div;
  };
  credit.addTo(map);

  // Fixed-class color function (0–15, 15–30, 30–45, 45–60)
  function getColor(v) {
    if (Number.isNaN(v)) return '#ccc';
    return v >= 45 ? '#006d2c' :
           v >= 30 ? '#2ca25f' :
           v >= 15 ? '#66c2a4' :
                     '#ccece6';
  }

  // Base style (normal)
  function baseStyle(feature) {
    const v = Number(feature.properties[CLASS_FIELD]);
    return {
      fillColor: getColor(v),
      weight: 1,
      color: 'white',
      fillOpacity: 0.75
    };
  }

  // Highlight style (on hover)
  function highlightStyle() {
    return {
      weight: 3,
      color: '#000',
      fillOpacity: 0.85
    };
  }

  // Info control (top right)
  const info = L.control({ position: 'topright' });
  info.onAdd = function () {
    this._div = L.DomUtil.create('div', 'info');
    this.update();
    return this._div;
  };
  info.update = function (props) {
    if (!props) {
      this._div.innerHTML = `<h4>${LEGEND_TITLE}</h4>Hover over a country`;
      return;
    }
    const v = Number(props[CLASS_FIELD]);
    this._div.innerHTML =
      `<h4>${LEGEND_TITLE}</h4>` +
      `<b>${props.COUNTRY}</b><br>` +
      `Value: ${Number.isNaN(v) ? "N/A" : v.toFixed(2)}`;
  };
  info.addTo(map);

  let geoLayer;

  function resetHighlight(e) {
    geoLayer.resetStyle(e.target);
    info.update();
  }

  function zoomToFeature(e) {
    map.fitBounds(e.target.getBounds(), { padding: [10, 10] });
  }

  function highlightFeature(e) {
    const layer = e.target;
    layer.setStyle(highlightStyle());

    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
      layer.bringToFront();
    }
    info.update(layer.feature.properties);
  }

  function onEachFeature(feature, layer) {
    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight,
      click: zoomToFeature
    });

    const v = Number(feature.properties[CLASS_FIELD]);
    layer.bindPopup(
      `<b>${feature.properties.COUNTRY}</b><br>` +
      `${LEGEND_TITLE}: ${Number.isNaN(v) ? "N/A" : v.toFixed(2)}`
    );
  }

  fetch(GEOJSON_FILE)
    .then(r => {
      if (!r.ok) throw new Error("GeoJSON not found. Check path. Status: " + r.status);
      return r.json();
    })
    .then(data => {
      geoLayer = L.geoJSON(data, {
        style: baseStyle,
        onEachFeature: onEachFeature
      }).addTo(map);

      // Tight zoom to mapped area (less empty space)
      map.fitBounds(geoLayer.getBounds(), { padding: [10, 10] });

      // Legend (fixed classes)
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = `<h4>SDG 10.4 (2024)<br>Labour Income Share (%)</h4>`;

        const ranges = [
          { label: '0 – 15', color: '#ccece6' },
          { label: '15 – 30', color: '#66c2a4' },
          { label: '30 – 45', color: '#2ca25f' },
          { label: '45 – 60', color: '#006d2c' }
        ];

        ranges.forEach(r => {
          div.innerHTML += `<i style="background:${r.color}"></i>${r.label}<br>`;
        });

        div.innerHTML += `<div style="margin-top:6px;font-size:12px;">
          Hover = highlight • Click = zoom
        </div>`;

        return div;
      };
      legend.addTo(map);
    })
    .catch(err => {
      console.error(err);
      alert(err.message);
    });
</script>
</body>
</html>
