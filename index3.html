<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SDG 10.4 (2024) – Labour Income Share (%)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root{
      --bg:#ffffff;
      --panel:rgba(255,255,255,0.92);
      --text:#1b1b1b;
      --muted:#5b5b5b;
      --border:rgba(0,0,0,0.12);
      --shadow:0 12px 30px rgba(0,0,0,0.14);
      --shadow-soft:0 8px 22px rgba(0,0,0,0.10);
      --accent:#ff7800;
      --accent2:#2563eb;
      --tile-filter:none;

      /* ✅ header height used everywhere */
      --header-h: 86px;
    }
    [data-theme="dark"]{
      --bg:#0b1220;
      --panel:rgba(17,24,39,0.88);
      --text:#f3f4f6;
      --muted:#b8c0cc;
      --border:rgba(255,255,255,0.14);
      --shadow:0 12px 34px rgba(0,0,0,0.45);
      --shadow-soft:0 8px 22px rgba(0,0,0,0.35);
      --accent:#ff9b3d;
      --accent2:#60a5fa;
      --tile-filter:brightness(0.9) contrast(1.05) saturate(0.9);
    }

    html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, Helvetica, sans-serif;
      overflow:hidden; /* ✅ no page scroll, removes grey/extra space feeling */
    }

    /* ===== Header ===== */
    .topbar{
      position: fixed;
      top:0; left:0; right:0;
      z-index: 1500;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .topbar-accent{
      height: 4px;
      background: linear-gradient(90deg, var(--accent2), var(--accent), #22c55e);
    }
    .topbar-inner{
      height: calc(var(--header-h) - 4px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 10px 14px;
      box-sizing: border-box;
    }
    .brand{ display:flex; align-items:center; gap:14px; min-width:0; }
    /* ✅ bigger logo */
    .brand-logo{
      width: 62px;
      height: 62px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(255,255,255,0.70);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 8px;
      box-sizing: border-box;
    }
    [data-theme="dark"] .brand-logo{ background: rgba(0,0,0,0.20); }

    .brand-text{ display:flex; flex-direction:column; gap: 4px; min-width:0; }
    .brand-title{
      font-size: 20px;
      font-weight: 850;
      letter-spacing: 0.2px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub{
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions{ display:flex; gap: 8px; flex: 0 0 auto; }
    .topbar-btn{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(37,99,235,0.12);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.05s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .topbar-btn:hover{ background: rgba(37,99,235,0.16); border-color: rgba(37,99,235,0.30); }
    .topbar-btn:active{ transform: translateY(1px); }
    .topbar-btn.outline{ background: transparent; }
    .topbar-btn.outline:hover{ background: rgba(255,120,0,0.10); border-color: rgba(255,120,0,0.35); }

    /* Mobile */
    @media (max-width: 680px){
      :root{ --header-h: 96px; }
      .topbar-actions{ display:none; }
      .brand-logo{ width: 56px; height: 56px; }
      .brand-title{ font-size: 17px; }
    }

    /* ✅ Map occupies full remaining viewport exactly */
    #map{
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      width: 100vw;
      height: calc(100vh - var(--header-h));
    }

    /* Make sure tiles look correct in dark mode */
    .leaflet-tile{ filter: var(--tile-filter); }

    /* Ensure controls are visible and not hidden */
    .leaflet-top, .leaflet-bottom{ z-index: 800; }
    .leaflet-control{ z-index: 900; }

    /* Keep zoom top-left with nice margin */
    .leaflet-top.leaflet-left{ margin-top: 12px; margin-left: 12px; }

    /* Panel (top-left) aligned under zoom */
    .panel{
      width: 360px;
      max-width: min(92vw, 400px);
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
      margin-top: 66px; /* space for zoom control */
    }
    .panel-header{
      padding: 5px 14px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--border);
    }
    .panel-title{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .panel-title strong{ font-size: 14px; letter-spacing:0.2px; }
    .panel-title span{ font-size: 12px; color: var(--muted); }

    .panel-body{
      padding: 12px 14px 14px;
      display:grid;
      gap: 12px;
    }
    .input{ display:grid; gap: 6px; }
    .input label{ font-size: 12px; color: var(--muted); }
    .input input[type="text"], .input select{
      width:100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.65);
      color: var(--text);
      outline:none;
      box-sizing: border-box;
    }
    [data-theme="dark"] .input input[type="text"], [data-theme="dark"] .input select{ background: rgba(0,0,0,0.18); }

    .btns{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.72);
      color: var(--text);
      padding: 11px 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.05s ease, background 0.2s ease, border-color 0.2s ease;
      user-select:none;
    }
    [data-theme="dark"] .btn{ background: rgba(0,0,0,0.20); }
    .btn:hover{ background: rgba(255,255,255,0.92); border-color: rgba(0,0,0,0.20); }
    [data-theme="dark"] .btn:hover{ background: rgba(0,0,0,0.32); border-color: rgba(255,255,255,0.22); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ border-color: rgba(37,99,235,0.35); background: rgba(37,99,235,0.14); }
    .btn.primary:hover{ background: rgba(37,99,235,0.18); }
    .btn.warn{ border-color: rgba(255,120,0,0.35); background: rgba(255,120,0,0.14); }
    .btn.warn:hover{ background: rgba(255,120,0,0.18); }

    .slider{
      display:grid;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.62);
    }
    [data-theme="dark"] .slider{ background: rgba(0,0,0,0.18); }
    .slider label{
      font-size: 12px;
      color: var(--muted);
      display:flex;
      justify-content:space-between;
      gap: 10px;
    }
    .slider input[type="range"]{ width:100%; }

    .toggle{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.62);
    }
    [data-theme="dark"] .toggle{ background: rgba(0,0,0,0.18); }
    .toggle .meta{ display:flex; flex-direction:column; gap:2px; }
    .toggle .meta strong{ font-size: 13px; }
    .toggle .meta span{ font-size: 12px; color: var(--muted); }

    .switch{
      width: 44px; height: 26px;
      border-radius: 999px;
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      flex: 0 0 auto;
    }
    [data-theme="dark"] .switch{ background: rgba(255,255,255,0.12); }
    .switch::after{
      content:"";
      width: 20px; height: 20px;
      border-radius: 999px;
      background: var(--bg);
      position:absolute;
      top: 2px; left: 2px;
      box-shadow: var(--shadow-soft);
      transition: left 0.18s ease;
    }
    .switch.on{ background: rgba(37,99,235,0.25); border-color: rgba(37,99,235,0.35); }
    .switch.on::after{ left: 22px; }

    .legend-mini{
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.62);
      display:grid;
      gap: 8px;
    }
    [data-theme="dark"] .legend-mini{ background: rgba(0,0,0,0.18); }
    .legend-mini h4{ margin: 0; font-size: 13px; line-height: 1.25; }
    .legend-item{ display:flex; align-items:center; gap:10px; font-size: 13px; }
    .swatch{
      width: 16px; height: 16px; border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.15);
      opacity: 0.9;
      flex: 0 0 16px;
    }
    [data-theme="dark"] .swatch{ border-color: rgba(255,255,255,0.18); }
    .hint{ font-size: 12px; color: var(--muted); line-height: 1.35; }

    /* Info box (top-right) */
    .info{
      line-height: 1.35;
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      max-width: min(360px, 72vw);
    }
    .info h4{ margin: 0 0 6px; font-size: 13px; line-height: 1.2; }
    .info .small{ font-size: 12px; color: var(--muted); }

    /* ✅ Credit bottom-right */
    .credit{
      background: var(--panel);
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      margin-bottom: 28px; /* keeps away from attribution */
      margin-right: 12px;
    }

    /* Loading overlay */
    .loading{
      position: fixed;
      inset: var(--header-h) 0 0 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.15);
      z-index: 2000;
    }
    [data-theme="dark"] .loading{ background: rgba(0,0,0,0.35); }
    .loading-card{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 220px;
      justify-content: center;
    }
    .spinner{
      width: 18px; height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: rgba(0,0,0,0.65);
      animation: spin 0.8s linear infinite;
    }
    [data-theme="dark"] .spinner{
      border-color: rgba(255,255,255,0.18);
      border-top-color: rgba(255,255,255,0.70);
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
  </style>
</head>

<body data-theme="light">

  <!-- Header (fixed) -->
  <header class="topbar">
    <div class="topbar-accent"></div>
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="images/logo.png" alt="Logo" />
        <div class="brand-text">
          <div class="brand-title">SDG 10.4 (2024): Labour Income Share (%)</div>
          <div class="brand-sub">Hover = highlight • Click = select (lock) • ESC = clear</div>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="btnHeaderReset" class="topbar-btn" type="button" title="Reset view">Reset view</button>
        <button id="btnHeaderClear" class="topbar-btn outline" type="button" title="Clear selection">Clear selection</button>
      </div>
    </div>
  </header>

  <!-- Full-viewport fixed map -->
  <div id="map"></div>

  <!-- Loading -->
  <div id="loading" class="loading" style="display:none;">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <div><strong>Loading map…</strong></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===== SETTINGS =====
    const GEOJSON_FILE = "./clipqgis_wgs84.geojson";
    const CLASS_FIELD  = "SL_EMP_G20"; // 2024 column
    const NAME_FIELD   = "COUNTRY";
    const LEGEND_TITLE = "SDG 10.4 (2024): Labour Income Share (%)";
    // ====================

    function getColor(v) {
      if (Number.isNaN(v)) return '#bdbdbd';
      return v >= 45 ? '#006d2c' :
             v >= 30 ? '#2ca25f' :
             v >= 15 ? '#66c2a4' :
                       '#ccece6';
    }

    // ✅ Map
    const map = L.map('map', { worldCopyJump: true, zoomControl: true }).setView([20, 0], 2);

    // ✅ Multiple basemaps
    const baseMaps = {
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }),

      "Carto Light": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }),

      "Carto Dark": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }),

      "Esri World Imagery": L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Tiles &copy; Esri'
        }
      ),

      "Esri Light Gray": L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 20,
          attribution: 'Tiles &copy; Esri'
        }
      )
    };

    // default basemap
    baseMaps["OpenStreetMap"].addTo(map);

    // Leaflet layer switcher (topright)
    // We'll keep it collapsed so it doesn't take too much space.
    const layersControl = L.control.layers(baseMaps, null, { position: 'topright', collapsed: true }).addTo(map);

    function stopMapEvents(el){
      L.DomEvent.disableClickPropagation(el);
      L.DomEvent.disableScrollPropagation(el);
    }

    // Credit bottom-right
    const credit = L.control({ position: 'bottomright' });
    credit.onAdd = function () {
      const div = L.DomUtil.create('div', 'credit');
      div.innerHTML = 'Prepared by <b>Bilal Ahmad</b>';
      stopMapEvents(div);
      return div;
    };
    credit.addTo(map);

    // Info (top-right)
    const info = L.control({ position: 'topright' });
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info');
      stopMapEvents(this._div);
      this.update();
      return this._div;
    };
    info.update = function (props, selected=false) {
      if (!props) {
        this._div.innerHTML = `
          <h4>${LEGEND_TITLE}</h4>
          <div class="small">Hover over a country<br>Tip: click to select</div>
        `;
        return;
      }
      const v = Number(props[CLASS_FIELD]);
      this._div.innerHTML = `
        <h4>${LEGEND_TITLE}</h4>
        <div><b>${props[NAME_FIELD] ?? "Unknown"}</b>${selected ? ` <span style="color:var(--accent); font-weight:700;">(selected)</span>` : ""}</div>
        <div class="small">Value: <b>${Number.isNaN(v) ? "N/A" : v.toFixed(2)}</b></div>
      `;
    };
    info.addTo(map);

    // Styles
    let fillOpacity = 0.78;

    function baseStyle(feature) {
      const v = Number(feature.properties[CLASS_FIELD]);
      return { fillColor: getColor(v), weight: 1, color: 'rgba(255,255,255,0.95)', fillOpacity };
    }
    function hoverStyle() {
      return { weight: 3, color: '#000', fillOpacity: Math.min(0.95, fillOpacity + 0.12) };
    }
    function selectedStyle() {
      return { weight: 4, color: '#ff7800', fillOpacity: Math.min(0.98, fillOpacity + 0.16) };
    }

    let geoLayer;
    let selectedLayer = null;
    let lastBounds = null;

    function clearSelection(){
      if (selectedLayer) {
        geoLayer.resetStyle(selectedLayer);
        selectedLayer = null;
        info.update();
      }
    }
    function setSelected(layer){
      clearSelection();
      selectedLayer = layer;
      layer.setStyle(selectedStyle());
      layer.bringToFront();
      info.update(layer.feature.properties, true);
    }

    function resetHighlight(e) {
      const layer = e.target;
      if (selectedLayer && layer === selectedLayer) return;
      geoLayer.resetStyle(layer);
      if (!selectedLayer) info.update();
    }
    function highlightFeature(e) {
      const layer = e.target;
      if (selectedLayer && layer === selectedLayer) return;
      layer.setStyle(hoverStyle());
      layer.bringToFront();
      info.update(layer.feature.properties, false);
    }
    function zoomToFeature(layer) {
      map.fitBounds(layer.getBounds(), { padding: [14, 14] });
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: () => { setSelected(layer); zoomToFeature(layer); layer.openPopup(); }
      });

      const v = Number(feature.properties[CLASS_FIELD]);
      layer.bindPopup(
        `<b>${feature.properties[NAME_FIELD] ?? "Unknown"}</b><br>` +
        `${LEGEND_TITLE}: ${Number.isNaN(v) ? "N/A" : v.toFixed(2)}`
      );
    }

    // Panel (top-left)
    const panel = L.control({ position: 'topleft' });
    panel.onAdd = function(){
      const div = L.DomUtil.create('div', 'panel');
      div.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">
            <strong>Interactive Controls</strong>
            <span>Search, style & navigation</span>
          </div>
          <button class="btn" id="btnCollapse" title="Collapse panel" style="padding:8px 10px;border-radius:12px;">▾</button>
        </div>

        <div class="panel-body" id="panelBody">

          <!-- ✅ Basemap selector inside left panel -->
          <div class="input">
            <label for="basemapSelect">Basemap</label>
            <select id="basemapSelect">
              <option value="OpenStreetMap">OpenStreetMap</option>
              <option value="Carto Light">Carto Light</option>
              <option value="Carto Dark">Carto Dark</option>
              <option value="Esri World Imagery">Esri World Imagery</option>
              <option value="Esri Light Gray">Esri Light Gray</option>
            </select>
          </div>

          <div class="input">
            <label for="countrySearch">Search Country</label>
            <input id="countrySearch" type="text" placeholder="Type a country name…" list="countryList" />
            <datalist id="countryList"></datalist>
          </div>

          <div class="btns">
            <button class="btn primary" id="btnFind">Find</button>
            <button class="btn" id="btnClearSearch">Clear</button>
          </div>

          <div class="btns">
            <button class="btn warn" id="btnClearSel">Clear selection</button>
            <button class="btn" id="btnResetView">Reset view</button>
          </div>

          <div class="slider">
            <label>
              <span>Fill opacity</span>
              <span id="opacityVal">${Math.round(fillOpacity*100)}%</span>
            </label>
            <input id="opacityRange" type="range" min="40" max="95" value="${Math.round(fillOpacity*100)}" />
          </div>

          <div class="toggle">
            <div class="meta">
              <strong>Dark mode</strong>
              <span>Switch UI theme</span>
            </div>
            <div class="switch" id="darkSwitch" role="switch" aria-checked="false" tabindex="0"></div>
          </div>

          <div class="legend-mini">
            <h4>${LEGEND_TITLE}</h4>
            <div class="legend-item"><span class="swatch" style="background:#ccece6"></span><span>0 – 15</span></div>
            <div class="legend-item"><span class="swatch" style="background:#66c2a4"></span><span>15 – 30</span></div>
            <div class="legend-item"><span class="swatch" style="background:#2ca25f"></span><span>30 – 45</span></div>
            <div class="legend-item"><span class="swatch" style="background:#006d2c"></span><span>45 – 60</span></div>
            <div class="hint">Hover = highlight • Click = select • ESC = clear</div>
          </div>

          <div class="hint" id="panelMsg" style="min-height:16px;"></div>
        </div>
      `;
      stopMapEvents(div);
      return div;
    };
    panel.addTo(map);

    // Loading
    const loadingEl = document.getElementById("loading");
    const showLoading = (on) => loadingEl.style.display = on ? "grid" : "none";

    function norm(s){ return (s ?? "").toString().trim().toLowerCase(); }

    function findLayerByName(query){
      if (!geoLayer) return null;
      const q = norm(query);
      if (!q) return null;

      let exact = null;
      geoLayer.eachLayer(l => {
        const n = norm(l.feature?.properties?.[NAME_FIELD]);
        if (n === q) exact = l;
      });
      if (exact) return exact;

      let contains = null;
      geoLayer.eachLayer(l => {
        const n = norm(l.feature?.properties?.[NAME_FIELD]);
        if (!contains && n.includes(q)) contains = l;
      });
      return contains;
    }

    function setMessage(txt){
      const msg = document.getElementById("panelMsg");
      if (msg) msg.textContent = txt || "";
    }

    function wirePanel(){
      const input = document.getElementById("countrySearch");
      const list  = document.getElementById("countryList");
      const btnFind = document.getElementById("btnFind");
      const btnClearSearch = document.getElementById("btnClearSearch");
      const btnClearSel = document.getElementById("btnClearSel");
      const btnResetView = document.getElementById("btnResetView");
      const opacityRange = document.getElementById("opacityRange");
      const opacityVal = document.getElementById("opacityVal");
      const darkSwitch = document.getElementById("darkSwitch");
      const btnCollapse = document.getElementById("btnCollapse");
      const panelBody = document.getElementById("panelBody");
      const basemapSelect = document.getElementById("basemapSelect");

      function doFind(){
        setMessage("");
        const layer = findLayerByName(input.value);
        if (!layer){ setMessage("Not found. Try a different spelling (matches COUNTRY field)."); return; }
        setSelected(layer);
        zoomToFeature(layer);
        layer.openPopup();
        setMessage("Found!");
      }

      // ✅ basemap dropdown switching (also keeps Leaflet control in sync)
      basemapSelect.addEventListener("change", () => {
        const name = basemapSelect.value;
        Object.keys(baseMaps).forEach(k => {
          if (map.hasLayer(baseMaps[k])) map.removeLayer(baseMaps[k]);
        });
        baseMaps[name].addTo(map);
      });

      btnFind.addEventListener("click", doFind);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") doFind(); });

      btnClearSearch.addEventListener("click", () => { input.value = ""; setMessage(""); });
      btnClearSel.addEventListener("click", () => { clearSelection(); setMessage("Selection cleared."); });

      btnResetView.addEventListener("click", () => {
        if (lastBounds) map.fitBounds(lastBounds, { padding: [14, 14] });
        setMessage("View reset.");
      });

      opacityRange.addEventListener("input", () => {
        const val = Number(opacityRange.value);
        fillOpacity = Math.max(0.4, Math.min(0.95, val/100));
        opacityVal.textContent = `${Math.round(fillOpacity*100)}%`;
        if (geoLayer) geoLayer.setStyle(baseStyle);
        if (selectedLayer) selectedLayer.setStyle(selectedStyle());
      });

      function setTheme(theme){
        document.body.setAttribute("data-theme", theme);
        const isDark = theme === "dark";
        darkSwitch.classList.toggle("on", isDark);
        darkSwitch.setAttribute("aria-checked", String(isDark));
        localStorage.setItem("sdg_theme", theme);

        // Optional: if user turns on dark mode, switch to Carto Dark if currently OSM
        // (comment out if you don't want auto switching)
        if (isDark && basemapSelect.value === "OpenStreetMap") {
          basemapSelect.value = "Carto Dark";
          basemapSelect.dispatchEvent(new Event("change"));
        }
      }
      function toggleTheme(){
        const cur = document.body.getAttribute("data-theme") || "light";
        setTheme(cur === "light" ? "dark" : "light");
      }
      darkSwitch.addEventListener("click", toggleTheme);
      darkSwitch.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") toggleTheme(); });

      const saved = localStorage.getItem("sdg_theme");
      if (saved === "dark" || saved === "light") setTheme(saved);

      let collapsed = false;
      btnCollapse.addEventListener("click", () => {
        collapsed = !collapsed;
        panelBody.style.display = collapsed ? "none" : "grid";
        btnCollapse.textContent = collapsed ? "▸" : "▾";
      });

      window.__setCountryList = (names) => {
        list.innerHTML = "";
        names.filter(Boolean).sort((a,b) => a.localeCompare(b)).forEach(n => {
          const opt = document.createElement("option");
          opt.value = n;
          list.appendChild(opt);
        });
      };
    }
    wirePanel();

    async function load(){
      try{
        showLoading(true);

        const res = await fetch(GEOJSON_FILE);
        if (!res.ok) throw new Error("GeoJSON not found. Check path. Status: " + res.status);
        const data = await res.json();

        geoLayer = L.geoJSON(data, { style: baseStyle, onEachFeature }).addTo(map);

        lastBounds = geoLayer.getBounds();
        map.fitBounds(lastBounds, { padding: [14, 14] });

        const names = [];
        geoLayer.eachLayer(l => {
          const n = l.feature?.properties?.[NAME_FIELD];
          if (n) names.push(String(n));
        });
        if (window.__setCountryList) window.__setCountryList(names);

      }catch(err){
        console.error(err);
        alert(err.message);
      }finally{
        showLoading(false);
      }
    }
    load();

    // ESC clears selection
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearSelection(); });

    // Header buttons
    document.getElementById("btnHeaderReset")?.addEventListener("click", () => {
      if (lastBounds) map.fitBounds(lastBounds, { padding: [14, 14] });
    });
    document.getElementById("btnHeaderClear")?.addEventListener("click", () => { clearSelection(); });
  </script>
</body>
</html>
